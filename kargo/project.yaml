apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: kargobook-demo
---
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: kargobook-demo
  namespace: kargobook-demo
spec:
  promotionPolicies:
    - stageSelector:
        name: payments-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: payments-pre-prod
      autoPromotionEnabled: true
    - stageSelector:
        name: payments-prod
      autoPromotionEnabled: false
    - stageSelector:
        name: auth-dev
      autoPromotionEnabled: true
    - stageSelector:
        name: auth-pre-prod
      autoPromotionEnabled: true
    - stageSelector:
        name: auth-prod
      autoPromotionEnabled: false

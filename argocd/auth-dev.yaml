apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-dev
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: "kargobook-demo:auth-dev"
spec:
  project: default
  source:
    repoURL: https://github.com/kargobook/demo-gitops.git
    targetRevision: main
    path: charts/auth-service
    helm:
      releaseName: auth-service
      valueFiles:
      - ../../apps/auth/envs/dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: auth-dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true

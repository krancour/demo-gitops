apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-prod
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: "kargobook-demo:payments-prod"
spec:
  project: default
  source:
    repoURL: https://github.com/kargobook/demo-gitops.git
    targetRevision: main
    path: charts/payments-api
    helm:
      releaseName: payments-api
      valueFiles:
      - ../../apps/payments/envs/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: payments-prod
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
